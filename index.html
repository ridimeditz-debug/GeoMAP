<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoMap · CBSE Class 12 Geography Map Practice</title>
  <meta name="description" content="Interactive map practice for CBSE Class 12 Geography: locate, identify and revise every prescribed map-work item.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <script>
    // Apply the saved or preferred theme before first paint (avoids a light flash in dark mode).
    try {
      var s = JSON.parse(localStorage.getItem('geomap.v1') || '{}'), t = s.settings && s.settings.theme;
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

    <button id="burger" class="icon-btn burger" aria-label="Menu">☰</button>
    <nav id="nav" aria-label="Main">

  <script src="data/bundle.js"></script>
  <script src="js/app.bundle.js"></script>
